version: "3.9"

services:
  api:
    build: .
    container_name: mll_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - chroma

  streamlit:
    build: .
    container_name: mll_streamlit
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      - FASTAPI_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: mll_chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - ./data/chroma:/chroma/chroma
    restart: unless-stopped
